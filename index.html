<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS - Imagem - Cartao Texto na Frente da Imagem</title>
</head>

<body>
    <div class="cartao">

                <p class="localizacao">
                    Belo Horizonte, MG
                </p>
            </div>
        </div>
    </div>
</body>

</html>
